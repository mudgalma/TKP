[project]
name = "tkp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chromadb>=0.6.0",
    "fastapi>=0.128.8",
    "langchain-core>=0.3.86",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.6.11",
    "llama-parse>=0.5.0",
    "marker-pdf>=0.2.17",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.26.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "sse-starlette>=3.3.0",
    "streamlit>=1.50.0",
    "supabase>=2.31.0",
    "tenacity>=9.0.0",
    "uvicorn>=0.39.0",
]

[project.scripts]
tkp = "tkp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
